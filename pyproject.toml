[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "giveaway-agent"
version = "0.1.0"
description = "Discover and locally analyze online giveaways and competitions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "playwright>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
giveaway-agent = "app.command_shortcuts:giveaway_agent"
fetch = "app.command_shortcuts:fetch"
discover = "app.command_shortcuts:discover"
list = "app.command_shortcuts:list_items"
show = "app.command_shortcuts:show"
inspect = "app.command_shortcuts:inspect"
giveaway-help = "app.command_shortcuts:show_help"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools]
py-modules = ["main"]
