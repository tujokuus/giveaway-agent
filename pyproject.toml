[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "giveaway-agent"
version = "0.1.0"
description = "Discover and locally analyze online giveaways and competitions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "playwright>=1.40,<2",
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
giveaway-agent = "app.command_shortcuts:giveaway_agent"
fetch = "app.command_shortcuts:fetch"
discover = "app.command_shortcuts:discover"
list = "app.command_shortcuts:list_items"
show = "app.command_shortcuts:show"
inspect = "app.command_shortcuts:inspect"
snapshot-serve = "app.command_shortcuts:snapshot_serve"
extension-inspect = "app.command_shortcuts:extension_inspect"
server = "app.command_shortcuts:server"
read-page = "app.command_shortcuts:read_page"
snapshots = "app.command_shortcuts:snapshots"
snapshot-show = "app.command_shortcuts:snapshot_show"
snapshot-check = "app.command_shortcuts:snapshot_check"
snapshot-prepare = "app.command_shortcuts:snapshot_prepare"
prepared-show = "app.command_shortcuts:prepared_show"
snapshot-compact = "app.command_shortcuts:snapshot_compact"
compact-show = "app.command_shortcuts:compact_show"
snapshot-run = "app.command_shortcuts:snapshot_run"
giveaway-run = "app.command_shortcuts:giveaway_run"
giveaway-run-all = "app.command_shortcuts:giveaway_run_all"
giveaway-run-next = "app.command_shortcuts:giveaway_run_next"
llm-analyze = "app.command_shortcuts:llm_analyze"
analysis-show = "app.command_shortcuts:analysis_show"
giveaway-help = "app.command_shortcuts:show_help"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools]
py-modules = ["main"]
