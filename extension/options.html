<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Giveaway Agent Reader</title></head>
  <body>
    <main>
      <h1>Giveaway Agent Reader</h1>
      <p>This extension only opens pages, reads their DOM, and sends snapshots locally.</p>
      <label>Backend URL <input id="backend" size="50" value="http://127.0.0.1:8765"></label><br>
      <label>API token <input id="token" type="password" size="50"></label><br>
      <button id="save" type="button">Save and poll now</button>
      <p id="status" role="status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
